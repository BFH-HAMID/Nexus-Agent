name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,context]"

      - name: Validate roles.yaml (111 curated roles, no dupes)
        run: python scripts/build_roles.py --check --stats

      - name: Ensure roles.yaml is up to date with its generator
        run: |
          python scripts/build_roles.py --out /tmp/roles.yaml
          if ! diff -u roles.yaml /tmp/roles.yaml; then
            echo "::error::roles.yaml is out of sync - edit scripts/build_roles.py and re-run it"
            exit 1
          fi

      - name: Ensure docs/roles.md is up to date with its generator
        run: |
          python scripts/build_roles.py --docs --out /tmp/roles.yaml
          if ! git diff --exit-code docs/roles.md; then
            echo "::error::docs/roles.md is out of sync - re-run scripts/build_roles.py --docs"
            exit 1
          fi

      - name: Smoke test the CLI
        run: |
          nexus version
          nexus roles --json | head -c 400
          nexus agents
          nexus keys
          nexus keys --json
          nexus prompt backend | head -20
          nexus doctor --json || true

      - name: Tests
        run: python -m pytest -q --junitxml=/tmp/nexus-pytest.xml

      - name: Annotate pytest failures
        if: failure()
        run: |
          python - <<'PYTEST_REPORT'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          report = Path("/tmp/nexus-pytest.xml")
          if report.exists():
              failures = 0
              for case in ET.parse(report).iter("testcase"):
                  for tag in ("failure", "error"):
                      failure = case.find(tag)
                      if failure is not None and failures < 10:
                          message = f"{case.get('classname', '')}.{case.get('name', '')}\n{failure.text or failure.get('message', '')}"
                          message = message[:6000].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                          print("::error::" + message)
                          failures += 1
          PYTEST_REPORT
