# ─────────────────────────────────────────────────────────────────────────────
# Nexus Agent — agents.yaml
#
# "kon model kothay" — every callable model endpoint lives here. Roles point at
# one of these names; the router never picks a model directly.
#
# All three supported providers speak the OpenAI chat-completions dialect, so a
# single adapter drives them:
#   gemini      -> https://generativelanguage.googleapis.com/v1beta/openai
#   deepseek    -> https://api.deepseek.com/v1
#   openrouter  -> https://openrouter.ai/api/v1
#
# API keys — no .env file needed:
#   nexus keys set gemini        # or: deepseek / openrouter
#   nexus keys                  # show what is configured
# Keys are stored in ~/.config/nexus/keys.json (chmod 600), or exported as
# GEMINI_API_KEY / DEEPSEEK_API_KEY / OPENROUTER_API_KEY.
#
# ${VAR} and ${VAR:-default} are expanded from the environment, so every model
# id below can be overridden without editing this file.
# ─────────────────────────────────────────────────────────────────────────────

default_agent: gemini

agents:
  # ── Google Gemini ─────────────────────────────────────────────────────────
  gemini:                             # default workhorse: real code edits, reviews
    provider: gemini
    model: ${GEMINI_MODEL:-gemini-3.8-flash}
    api_key_env: GEMINI_API_KEY
    max_tokens: 8192
    supports_tools: true
    tool_mode: native
    fallback: deepseek                # no Gemini key? keep working on DeepSeek
    description: Default workhorse - long-horizon coding with reliable native tool calling.

  gemini-big:                         # long-horizon architecture, hard refactors
    provider: gemini
    model: ${GEMINI_BIG_MODEL:-gemini-4-argon}
    api_key_env: GEMINI_API_KEY
    max_tokens: 16384
    supports_tools: true
    tool_mode: native
    fallback: gemini
    description: Flagship reasoning with a 1M context window.

  gemini-flash:                       # routing, classification, summaries
    provider: gemini
    model: ${GEMINI_FAST_MODEL:-gemini-3.5-flash-lite}
    api_key_env: GEMINI_API_KEY
    max_tokens: 4096
    temperature: 0.0
    supports_tools: true
    tool_mode: native
    fallback: gemini
    description: Cheapest/fastest Gemini - used by the router LLM fallback.

  # ── DeepSeek ──────────────────────────────────────────────────────────────
  deepseek:                           # cheap bulk work: docs, QA, business, trading
    provider: deepseek
    model: ${DEEPSEEK_MODEL:-deepseek-flash}
    api_key_env: DEEPSEEK_API_KEY
    max_tokens: 8192
    temperature: 0.3
    supports_tools: true
    tool_mode: native
    fallback: openrouter
    description: Low-cost, 1M-context workhorse with tool calling.

  deepseek-pro:                       # the hard reasoning tier
    provider: deepseek
    model: ${DEEPSEEK_PRO_MODEL:-deepseek-v4-pro}
    api_key_env: DEEPSEEK_API_KEY
    max_tokens: 16384
    supports_tools: true
    tool_mode: native
    fallback: deepseek
    description: DeepSeek's top reasoning model for architectural or gnarly tasks.

  # ── OpenRouter (any hosted open model behind one key) ─────────────────────
  openrouter:
    provider: openrouter
    model: ${OPENROUTER_MODEL:-openrouter/auto}   # or e.g. deepseek/deepseek-v4-pro
    api_key_env: OPENROUTER_API_KEY
    max_tokens: 8192
    supports_tools: true
    tool_mode: native
    fallback: gemini
    description: Hosted open models; `openrouter/auto` picks one for you.

  # Uncensored open model for authorized pentesting / OSINT / RE research.
  # Override the model with OPENROUTER_UNCENSORED_MODEL; `nexus models` lists ids.
  openrouter-uncensored:
    provider: openrouter
    model: ${OPENROUTER_UNCENSORED_MODEL:-cognitivecomputations/dolphin-mistral-24b-venice-edition}
    api_key_env: OPENROUTER_API_KEY
    max_tokens: 8192
    temperature: 0.6
    timeout: 300
    supports_tools: true
    tool_mode: text                   # JSON tool contract in the prompt, parsed back
    fallback: openrouter
    description: Uncensored model for authorized offensive-security / OSINT work.

  # ── Anything else OpenAI-compatible (vLLM, llama.cpp, LM Studio, ...) ─────
  # local:
  #   provider: openai-compatible
  #   model: llama3.1:8b
  #   base_url: http://localhost:11434/v1
  #   api_key: ollama                 # ignored by Ollama, required by the shim
  #   supports_tools: true
  #   tool_mode: native

# ─────────────────────────────────────────────────────────────────────────────
# Behaviour knobs (all overridable with NEXUS_* environment variables)
# ─────────────────────────────────────────────────────────────────────────────
settings:
  auto_route: true              # router decides the role for every task
  router_min_score: 1.0         # keyword score needed to skip the LLM classifier
  router_llm_fallback: true     # ask a model when no keyword matched
  router_agent: gemini-flash    # which agent runs the classifier (empty = default)
  max_turns: 24                 # hard stop for the tool loop
  auto_yes: false               # true = never ask (dangerous calls still blocked)
  allow_dangerous: false        # true = deny-listed commands become "ask" instead of "refuse"
  command_timeout: 120          # seconds per shell command
  max_output_chars: 24000       # tool output clipping
  max_read_chars: 120000        # read_file clipping
  context_char_budget: 240000   # compact old tool results above this
  memory_enabled: true          # Phase 7: per-role notes in .nexus/memory
  memory_dir: .nexus/memory
  memory_max_chars: 4000
  auto_branch: true             # Phase 4: feat/<role>-<slug>
  branch_prefix: feat
  auto_commit_message: true
  pr_template: .github/PULL_REQUEST_TEMPLATE.md
  always_allow_tools: []        # e.g. [run_command] to stop prompting for the shell
  never_allow_tools: []         # e.g. [gh_merge_pr]
  blocked_command_patterns: []  # extra regexes appended to the built-in deny list
