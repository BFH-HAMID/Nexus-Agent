# Operator-owned policy. Agent tools cannot edit this file.
# Modes: READ_ONLY, ASK_EVERY_TIME, AUTO_ALLOW.
# Missing file also defaults to ASK_EVERY_TIME; --yes does not override it.
schema: 1
default: ASK_EVERY_TIME
tools:
  read_file: READ_ONLY
  list_files: READ_ONLY
  grep: READ_ONLY
  run_command: ASK_EVERY_TIME
  git: ASK_EVERY_TIME
  gh: ASK_EVERY_TIME
# Shell/Git execution and registered dangerous/external mutations always require
# fresh approval, even under AUTO_ALLOW. This is not an OS sandbox.

# Optional adapters remain OFF until the operator reviews their scope.
computer:
  browser: false
  editor: false
  office: false
  browser_origins: []
  shell_backend: host
  image: ""
  # New environment controls. Only an operator may enable/narrow these scopes.
  desktop:
    enabled: false
    backend: auto                 # auto | xdotool (X11 + wmctrl) | pywinauto (Windows)
    apps: {}                      # exact trusted executable + window class + action allowlist
  browser_controls:
    enabled: false                # open/search/draft_form/extract_data
    forms: false                  # separate draft digest + fresh submit approval
    downloads: false              # bounded unauthenticated downloads, never opened
    download_dir: browser-downloads
    max_download_bytes: 2000000
    search_url: ""                # exact allowlisted URL with one {query} placeholder
  files:
    enabled: false
    roots: []                     # workspace-relative roots; no symlinks/private/operator files
    max_files: 200
    max_bytes: 20000000
  workflows:
    enabled: false
    voice: false
    directory: computer-macros
    approved: {}                  # name: SHA256 of the operator-reviewed name.yaml
    allowed_tools: []             # intersects the live role's registry, never widens it
    max_steps: 30
  smart_home:
    enabled: false
    voice: false
    home_assistant:
      enabled: false
      url: ""                    # HTTPS exact origin including port (or loopback HTTP)
      devices: {}                # alias: {entity: light.desk, services: [turn_off]}
    mqtt:
      enabled: false
      host: ""
      port: 8883                 # TLS mandatory; credentials in env/keyring, never YAML
      devices: {}                # alias: {topic: exact/topic, kind: light, commands: {off: 'OFF'}}
    voice_commands: {}           # exact phrase -> adapter/device/action (no inferred authority)
# Recommended for untrusted code or production use:
#   shell_backend: docker
#   image: "python:3.12-slim@sha256:<64-hex-digest>"
# Run `nexus sandbox check` after pulling and configuring the digest-pinned image.
# Host shell execution is explicitly approved, not claimed to be sandboxed.

# Optional Docker sandbox resource & isolation invariants (defaults shown):
# sandbox:
#   network: none
#   read_only: true
#   memory: 512m
#   cpus: 1
#   pids_limit: 128
#   timeout_seconds: 60
#   workspace_only: true

# Optional second-factor confirmation for dangerous actions (OFF by default):
# second_factor:
#   enabled: false
#   method: pin                  # pin | telegram | either
#   pin_env: NEXUS_APPROVAL_PIN  # or TELEGRAM_APPROVAL_PIN
#   risks: [dangerous]
#   tools: []
#   timeout_seconds: 60

# Optional rate & cost limits (OFF by default):
# limits:
#   enabled: false
#   actions_per_minute: 30
#   daily_tokens: 0
#   daily_cost_usd: 0.0
