# Operator-owned policy. Agent tools cannot edit this file.
# Modes: READ_ONLY, ASK_EVERY_TIME, AUTO_ALLOW.
# Missing file also defaults to ASK_EVERY_TIME; --yes does not override it.
schema: 1
default: ASK_EVERY_TIME
tools:
  read_file: READ_ONLY
  list_files: READ_ONLY
  grep: READ_ONLY
  run_command: ASK_EVERY_TIME
  git: ASK_EVERY_TIME
  gh: ASK_EVERY_TIME
# Shell/Git execution and registered dangerous/external mutations always require
# fresh approval, even under AUTO_ALLOW. This is not an OS sandbox.

# Optional adapters remain OFF until the operator reviews their scope.
computer:
  browser: false
  editor: false
  office: false
  browser_origins: []
  shell_backend: host
  image: ""
# Recommended for untrusted code or production use:
#   shell_backend: docker
#   image: "python:3.12-slim@sha256:<64-hex-digest>"
# Run `nexus sandbox check` after pulling and configuring the digest-pinned image.
# Host shell execution is explicitly approved, not claimed to be sandboxed.

# Optional Docker sandbox resource & isolation invariants (defaults shown):
# sandbox:
#   network: none
#   read_only: true
#   memory: 512m
#   cpus: 1
#   pids_limit: 128
#   timeout_seconds: 60
#   workspace_only: true

# Optional second-factor confirmation for dangerous actions (OFF by default):
# second_factor:
#   enabled: false
#   method: pin                  # pin | telegram | either
#   pin_env: NEXUS_APPROVAL_PIN  # or TELEGRAM_APPROVAL_PIN
#   risks: [dangerous]
#   tools: []
#   timeout_seconds: 60

# Optional rate & cost limits (OFF by default):
# limits:
#   enabled: false
#   actions_per_minute: 30
#   daily_tokens: 0
#   daily_cost_usd: 0.0
