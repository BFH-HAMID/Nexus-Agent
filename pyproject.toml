[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "nexus-agent"
version = "0.3.0"
description = "Nexus - one CLI/VS Code agent that routes your task to a team of specialist agents (Gemini, DeepSeek, OpenRouter) and ships the result."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "NXR HAMID" }]
keywords = ["agent", "llm", "cli", "multi-agent", "gemini", "deepseek", "openrouter", "automation", "devtools"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Utilities",
]
dependencies = [
  "tzdata>=2024.1",
  "feedparser>=6.0,<7",
  "httpx>=0.27",
  "psutil>=5.9",
  "filelock>=3.16",
  "PyYAML>=6.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
context = ["mss>=9,<11", "Pillow>=10,<13", "pytesseract>=0.3.13,<1"]
mcp = ["jsonschema>=4.23,<5", "keyring>=25"]
hud = ["keyring>=25", "feedparser>=6.0,<7", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "websockets>=13,<17", "textual>=0.80,<9"]
dev = ["feedparser>=6.0,<7", "jsonschema>=4.23,<5", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "websockets>=13,<17", "textual>=0.80,<9", "pytest>=8.0", "tomli>=2; python_version < '3.11'", "ruff>=0.6", "cryptography>=44", "keyring>=25", "faiss-cpu>=1.8,<2", "numpy>=1.25,<3", "python-docx>=1.1,<2", "openpyxl>=3.1,<4", "python-pptx>=1.0,<2"]
orchestrator = ["faiss-cpu>=1.8,<2", "numpy>=1.25,<3"]
computer = ["playwright>=1.50,<2", "python-docx>=1.1,<2", "openpyxl>=3.1,<4", "python-pptx>=1.0,<2"]
secure-state = ["cryptography>=44", "keyring>=25", "filelock>=3.16"]
# only if you point agents.yaml at the legacy Anthropic Messages API
anthropic = ["anthropic>=0.40"]

[project.urls]
Homepage = "https://github.com/BFH-HAMID/Nexus-Agent"
Issues = "https://github.com/BFH-HAMID/Nexus-Agent/issues"

[project.scripts]
nexus = "nexus.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["nexus"]

[tool.hatch.build.targets.wheel.force-include]
"agents.yaml" = "nexus/_config/agents.yaml"
"roles.yaml" = "nexus/_config/roles.yaml"
"roles.d" = "nexus/_config/roles.d"
"pipelines.yaml" = "nexus/_config/pipelines.yaml"
"skills" = "nexus/_config/skills"
"role-index.yaml" = "nexus/_config/role-index.yaml"
"permissions.yaml" = "nexus/_config/permissions.yaml"
"autonomy.yaml" = "nexus/_config/autonomy.yaml"
".env.example" = "nexus/_config/.env.example"
"docs/jarvis.md" = "nexus/_config/docs/jarvis.md"
"docs/delegation.md" = "nexus/_config/docs/delegation.md"
"hud.yaml" = "nexus/_config/hud.yaml"
"widget.yaml" = "nexus/_config/widget.yaml"
"docs/world-widget.md" = "nexus/_config/docs/world-widget.md"
"docs/images/world-desktop-offline.png" = "nexus/_config/docs/images/world-desktop-offline.png"
"docs/images/world-svg-bangla-offline.png" = "nexus/_config/docs/images/world-svg-bangla-offline.png"
"docs/images/world-mobile-offline.png" = "nexus/_config/docs/images/world-mobile-offline.png"
"mcp.yaml" = "nexus/_config/mcp.yaml"
"telegram.yaml" = "nexus/_config/telegram.yaml"
"context.yaml" = "nexus/_config/context.yaml"
"docs/hud.md" = "nexus/_config/docs/hud.md"
"docs/gui.md" = "nexus/_config/docs/gui.md"
"docs/desktop-control-center.md" = "nexus/_config/docs/desktop-control-center.md"
"docs/images/gui-control-center.png" = "nexus/_config/docs/images/gui-control-center.png"
"docs/images/gui-desktop-setup.png" = "nexus/_config/docs/images/gui-desktop-setup.png"
"docs/images/gui-telegram-runtime.png" = "nexus/_config/docs/images/gui-telegram-runtime.png"
"docs/gui-control-coverage.md" = "nexus/_config/docs/gui-control-coverage.md"
"docs/images/gui-main.png" = "nexus/_config/docs/images/gui-main.png"
"docs/images/gui-operations.png" = "nexus/_config/docs/images/gui-operations.png"
"docs/images/gui-world.png" = "nexus/_config/docs/images/gui-world.png"
"docs/images/gui-world-settings.png" = "nexus/_config/docs/images/gui-world-settings.png"
"docs/images/gui-mobile.png" = "nexus/_config/docs/images/gui-mobile.png"
"docs/images/gui-management.png" = "nexus/_config/docs/images/gui-management.png"

"docs/mcp.md" = "nexus/_config/docs/mcp.md"
"docs/telegram.md" = "nexus/_config/docs/telegram.md"
"docs/context.md" = "nexus/_config/docs/context.md"
"docs/evaluation.md" = "nexus/_config/docs/evaluation.md"
"examples/mcp" = "nexus/_config/examples/mcp"

[tool.hatch.build.targets.sdist]
include = ["nexus", "roles.d", "skills", "tests", "scripts", "examples", "frontend/world", "agents.yaml", "roles.yaml", "pipelines.yaml", "role-index.yaml", "permissions.yaml", "autonomy.yaml", "hud.yaml", "widget.yaml", "mcp.yaml", "telegram.yaml", "context.yaml", ".env.example", "docs", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 118
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
