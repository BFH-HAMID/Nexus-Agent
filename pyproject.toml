[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "nexus-agent"
version = "0.1.0"
description = "Nexus - one CLI/VS Code agent that routes your task to a team of specialist agents (Claude, Hermes, Ollama, uncensored local models) and ships the result."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "NXR HAMID" }]
keywords = ["agent", "llm", "cli", "multi-agent", "anthropic", "ollama", "hermes", "automation", "devtools"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Utilities",
]
dependencies = [
  "anthropic>=0.40",
  "httpx>=0.27",
  "PyYAML>=6.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/BFH-HAMID/Nexus-Agent"
Issues = "https://github.com/BFH-HAMID/Nexus-Agent/issues"

[project.scripts]
nexus = "nexus.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["nexus"]

[tool.hatch.build.targets.wheel.force-include]
"agents.yaml" = "nexus/_config/agents.yaml"
"roles.yaml" = "nexus/_config/roles.yaml"
"pipelines.yaml" = "nexus/_config/pipelines.yaml"
".vscode/tasks.json" = "nexus/bundled/vscode-tasks.json"
".vscode/launch.json" = "nexus/bundled/vscode-launch.json"
".vscode/settings.json" = "nexus/bundled/vscode-settings.json"

[tool.hatch.build.targets.sdist]
include = ["nexus", "tests", "scripts", "agents.yaml", "roles.yaml", "pipelines.yaml", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 118
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
