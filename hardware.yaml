# Nexus hardware control (Task 24) - OPERATOR-OWNED, default OFF.
#
# Lets Nexus talk to devices YOU list here, using only the commands YOU write
# here. The model picks a device name, a command name and bounded parameters;
# it can never compose a payload, a port, a topic or a pin.
#
#   class: read      -> tool hardware_read      (no approval)
#   class: actuate   -> tool hardware_actuate   (normal approval)
#   class: critical  -> tool hardware_critical  (fresh approval every time; the default)
#
# Start with dry_run: true - commands are checked, approved and logged, but
# nothing is transmitted. Device replies are treated as untrusted data.
# Never put passwords here: name the environment variable that holds them.
# Needs for real devices: pip install "nexus-agent[hardware]".
# This file is protected: the model cannot edit it.
schema: 1
enabled: false

dry_run: true              # true = transmit nothing, only show/log what would be sent
safe_on_stop: true         # `nexus stop` also sends every device's `safe` command

rate:
  max_per_minute: 20       # commands per minute, all devices together (safe commands are exempt)

response:
  max_bytes: 2000          # longest reply kept from a device
  timeout_ms: 1500         # how long to wait for a device

devices: {}
