<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-labelledby="approvalTitle" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #0b0f19; border-radius: 12px;">
  <title id="approvalTitle">Approval Gate Flow</title>
  <defs>
    <style>
      .node { rx: 10; ry: 10; fill: #1e293b; stroke: #334155; stroke-width: 2; }
      .node.danger { stroke: #f87171; stroke-width: 3; }
      .node.safe { stroke: #4ade80; stroke-width: 3; }
      .label { font-size: 13px; font-weight: 700; fill: #e2e8f0; text-anchor: middle; }
      .sub-label { font-size: 11px; fill: #94a3b8; text-anchor: middle; }
      .arrow { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#arrowhead); }
      .arrow.yes { stroke: #4ade80; stroke-dasharray: 6,4; }
      .arrow.no { stroke: #f87171; stroke-dasharray: 6,4; }
      .arrow.ask { stroke: #fbbf24; stroke-dasharray: 6,4; }
      .packet { fill: #38bdf8; stroke: #fff; stroke-width: 1.5; }
      .badge { font-size: 11px; font-weight: 700; fill: #fff; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569" />
    </marker>
  </defs>

  <text x="450" y="30" class="label" font-size="18" fill="#38bdf8">Approval Gate — Three Independent Layers</text>

  <!-- Layer 1: Path Guard -->
  <rect x="30" y="70" width="260" height="90" class="node" />
  <text x="160" y="100" class="label">LAYER 1 — Path Guard</text>
  <text x="160" y="120" class="sub-label">Every path resolves inside workspace</text>
  <text x="160" y="135" class="sub-label">Escapes refused unless --allow-outside</text>

  <!-- Layer 2: Deny List -->
  <rect x="320" y="70" width="260" height="90" class="node" />
  <text x="450" y="100" class="label">LAYER 2 — Deny List</text>
  <text x="450" y="120" class="sub-label">rm -rf /, sudo rm, mkfs, dd of=/dev/…</text>
  <text x="450" y="135" class="sub-label">fork bombs, git push --force, curl … | sh</text>

  <!-- Layer 3: Approval Modes -->
  <rect x="610" y="70" width="260" height="90" class="node" />
  <text x="740" y="100" class="label">LAYER 3 — Approval Modes</text>
  <text x="740" y="120" class="sub-label">ask (default) · auto (--yes) · plan (--plan)</text>
  <text x="740" y="135" class="sub-label">--yes will NOT skip danger class</text>

  <!-- Tool categories -->
  <rect x="30" y="200" width="260" height="130" class="node safe" />
  <text x="160" y="230" class="label">READ (risk: read)</text>
  <text x="160" y="250" class="sub-label">read_file, grep, list_files</text>
  <text x="160" y="265" class="sub-label">git status, diff, log</text>
  <text x="160" y="280" class="badge">NEVER PROMPTS ✓</text>

  <rect x="320" y="200" width="260" height="130" class="node" />
  <text x="450" y="230" class="label">WRITE (risk: write)</text>
  <text x="450" y="250" class="sub-label">write_file, edit_file, run_command</text>
  <text x="450" y="265" class="sub-label">git commit, gh pr create</text>
  <text x="450" y="280" class="badge">PROMPTS unless --yes</text>

  <rect x="610" y="200" width="260" height="130" class="node danger" />
  <text x="740" y="230" class="label">DANGER (risk: danger)</text>
  <text x="740" y="250" class="sub-label">delete_file, gh pr merge/close</text>
  <text x="740" y="265" class="sub-label">ALWAYS prompts — even with --yes</text>
  <text x="740" y="280" class="badge">NO BYPASS ✗</text>

  <!-- Arrows -->
  <line x1="160" y1="160" x2="160" y2="200" class="arrow" />
  <line x1="450" y1="160" x2="450" y2="200" class="arrow" />
  <line x1="740" y1="160" x2="740" y2="200" class="arrow" />

  <!-- Note -->
  <rect x="30" y="340" width="840" height="40" class="node" />
  <text x="450" y="365" class="label" font-size="12">Three independent layers — all must pass. No single layer can be bypassed by --yes or saved scope.</text>
</svg>
