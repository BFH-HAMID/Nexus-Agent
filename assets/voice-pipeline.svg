<svg xmlns="http://www.w3.org/2000/svg" width="900" height="350" viewBox="0 0 900 350" role="img" aria-labelledby="voiceTitle" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #0b0f19; border-radius: 12px;">
  <title id="voiceTitle">Voice Pipeline</title>
  <defs>
    <style>
      .node { rx: 10; ry: 10; fill: #1e293b; stroke: #334155; stroke-width: 2; }
      .node.active { fill: #0f172a; stroke: #38bdf8; stroke-width: 3; }
      .node.stop { stroke: #f87171; stroke-width: 3; }
      .label { font-size: 13px; font-weight: 700; fill: #e2e8f0; text-anchor: middle; }
      .sub-label { font-size: 11px; fill: #94a3b8; text-anchor: middle; }
      .arrow { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#arrowhead); }
      .arrow.active { stroke: #38bdf8; stroke-dasharray: 6,4; animation: pulse 2s ease-in-out infinite; }
      .arrow.stop { stroke: #f87171; stroke-dasharray: 6,4; }
      .packet { fill: #38bdf8; stroke: #fff; stroke-width: 1.5; }
      @keyframes pulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569" />
    </marker>
  </defs>

  <text x="450" y="30" class="label" font-size="18" fill="#38bdf8">Voice Pipeline — Wake → STT → LLM → TTS</text>

  <!-- Mic -->
  <rect x="40" y="70" width="150" height="80" class="node active" />
  <text x="115" y="100" class="label">MICROPHONE</text>
  <text x="115" y="120" class="sub-label">Wake word: "Nexus"</text>
  <text x="115" y="135" class="sub-label">Bangla + English support</text>

  <!-- STT -->
  <rect x="230" y="70" width="150" height="80" class="node active" />
  <text x="305" y="100" class="label">STT</text>
  <text x="305" y="120" class="sub-label">Speech → Text</text>
  <text x="305" y="135" class="sub-label">Local / cloud adapter</text>

  <!-- LLM -->
  <rect x="420" y="70" width="150" height="80" class="node active" />
  <text x="495" y="100" class="label">LLM</text>
  <text x="495" y="120" class="sub-label">Route → Plan → Execute</text>
  <text x="495" y="135" class="sub-label">With approval gate</text>

  <!-- TTS -->
  <rect x="610" y="70" width="150" height="80" class="node active" />
  <text x="685" y="100" class="label">TTS</text>
  <text x="685" y="120" class="sub-label">Text → Speech</text>
  <text x="685" y="135" class="sub-label">Piper / local voice</text>

  <!-- Stop phrase branch -->
  <rect x="230" y="200" width="150" height="90" class="node stop" />
  <text x="305" y="230" class="label" fill="#f87171">STOP PHRASE</text>
  <text x="305" y="250" class="sub-label" fill="#fca5a5">"Nexus, stop everything"</text>
  <text x="305" y="265" class="sub-label" fill="#fca5a5">Matched locally — no LLM</text>
  <text x="305" y="280" class="sub-label" fill="#fca5a5">Works when LLM unreachable</text>

  <!-- Arrows -->
  <line x1="190" y1="110" x2="230" y2="110" class="arrow active" />
  <line x1="380" y1="110" x2="420" y2="110" class="arrow active" />
  <line x1="570" y1="110" x2="610" y2="110" class="arrow active" />

  <!-- Stop arrow -->
  <line x1="115" y1="180" x2="115" y2="200" class="arrow" stroke="#f87171" stroke-dasharray="6,4" />
  <line x1="115" y2="200" x2="230" y2="220" class="arrow" stroke="#f87171" stroke-dasharray="6,4" />

  <!-- Animated packets -->
  <circle cx="200" cy="110" r="5" class="packet" />
  <animate attributeName="cx" from="200" to="370" dur="2s" repeatCount="indefinite" />
  <circle cx="390" cy="110" r="5" class="packet" />
  <animate attributeName="cx" from="390" to="560" dur="2s" repeatCount="indefinite" />
  <circle cx="580" cy="110" r="5" class="packet" />
  <animate attributeName="cx" from="580" to="700" dur="2s" repeatCount="indefinite" />
</svg>
