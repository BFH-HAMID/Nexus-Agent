  commit-archaeologist:
    title: commit-archaeologist
    category: agent-skills
    agent: ''
    persona: |-
      Reconstructs why code exists from local git history, including the introducing commit, later changes, current authors, repeated companion files, and likely intent. Use when the user asks "why does this code exist", "who wrote this function and why", or to "explain the history of this function" before a rewrite, refactor, or risky edit. Runs entirely locally.

      # Commit Archaeologist

      `git blame` names the last person to touch a line. This skill reconstructs the
      reason the line exists. It traces a file or current line range through local git
      history, identifies its origin and later edits, finds files that repeatedly
      changed beside it, and extracts intent clues from commit messages.

      Everything runs locally. No network calls, API keys, or repository writes.

      ## When to use

      - The user asks why a block, function, or file exists
      - The user wants to know who introduced code and what changed afterward
      - A rewrite or refactor needs historical constraints and change risks
      - A workaround, temporary branch, or surprising design choice needs context

      ## When not to use

      - The user only wants raw blame output or a commit list
      - The task is to squash, delete, or rewrite git history
      - The repository is remote and has not been cloned locally
      - The question is about project-wide architecture rather than one file or region

      ## Gather the target

      Get the repository path and tracked file path. Use a line range when the user
      names a current block or function. If either path is missing, ask only for the
      missing value. Do not scan sibling repositories.

      Paths should be relative to the repository and use forward slashes. Line ranges
      use inclusive current line numbers such as `40-72`.

      ## Run the dig

      From this skill directory:

      ```bash
      python3 scripts/archaeologist.py /path/to/repo src/cache.py --lines 40-72 --json
      ```

      For the complete history of a file, omit `--lines`:

      ```bash
      python3 scripts/archaeologist.py /path/to/repo src/cache.py --json
      ```

      The script is read-only. With a range it uses git line-log; without one it uses
      file history with rename following. It also reads current authorship with blame.
      If it rejects a path or range, report that error and ask for a corrected target.

      Before interpreting the JSON, read
      `references/reading-git-history.md`. Its confidence rules prevent blame
      ownership, correlation, and commit-message hints from becoming false certainty.

      ## Read the JSON

      - `region`: normalized repository, current and historical paths, mode, range,
        and co-change threshold
      - `introduced_by`: oldest commit in the selected history
      - `timeline`: commits ordered oldest to newest, with category, changed files,
        and detected renames
      - `co_changed`: files present beside the target in enough selected commits
      - `authors`: current blamed lines and historical commit counts, kept separate
      - `intent_signals`: issue references, reverts, workarounds, temporary markers,
        and unfinished-work markers found in commit messages

      An empty signal list means the messages do not say why. It does not mean the
      change had no reason.

      ## Write the report

      Turn the JSON into a short "why this code exists" report:

      1. **Bottom line.** One or two sentences with the most likely explanation and
         a confidence label: high, medium, or low.
      2. **Origin.** Introducing hash, date, author, subject, and the neighboring
         files that make the initial purpose clearer.
      3. **Timeline.** Oldest to newest. Group mechanical edits when they do not
         change the story, but preserve reverts, fixes, and workarounds.
      4. **Companion files.** Explain repeated co-changes as a coupling clue. Do not
         treat a one-off file in `changed_files` as a dependency.
      5. **Intent evidence.** Quote short commit subjects or signal words. Label any
         conclusion beyond those facts as an inference.
      6. **Change risk.** Name the constraints, companion files, and unresolved
         temporary choices worth checking before an edit.

      Keep hashes short in prose, but preserve enough characters to identify them.
      Do not dump the full JSON unless the user asks.

      ## Evidence rules

      - Current blame ownership is not proof of original authorship.
      - The oldest selected commit is the region's introduction, not always the
        file's first commit.
      - Repeated co-change suggests coupling; it does not prove a dependency.
      - Commit categories are message heuristics, not verified issue types.
      - "Temporary" and "workaround" are strong intent clues, but only the message
        author or linked discussion can confirm whether the constraint still applies.
      - If the history is thin or messages are vague, say "the history shows" and
        "likely" instead of inventing a design rationale.

      ## Follow-ups

      End by offering one relevant follow-up, such as:

      - "Want me to assess whether this looks deliberate or accidental?"
      - "Want me to map what could break if this region changes?"

      For a deliberate-choice question, weigh repeated edits, issue references,
      reverts, and explicit constraint words. For a change-risk question, inspect the
      repeated co-change files and the last behavior-changing commits before proposing
      edits. Do not modify code until the user asks.

      ## Files

      - `scripts/archaeologist.py`: offline git history walker and JSON report builder
      - `references/reading-git-history.md`: interpretation and confidence guide
    keywords:
    - commit-archaeologist
    - reconstructs
    - why
    - code
    - exists
    - local
    - git
    - history
    - including
    - introducing
    - commit
    - later
    - changes
    - current
  dependency-doctor:
    title: dependency-doctor
    category: agent-skills
    agent: ''
    persona: |-
      Checks requirements.txt, pyproject.toml, and package.json dependency manifests for surface-level direct-dependency footguns: standard-library shadowing pins, abandoned backports, unpinned dependencies, and obvious intra-manifest conflicts, plus opt-in PyPI yanked releases. Use when the user asks to check a manifest for dependency problems, asks why dependencies won't install or whether anything is

      [... truncated on import]

      # Dependency Doctor

      Inspect one dependency manifest on the user's machine for direct, surface-level
      footguns. Explain each finding in plain language, then offer a small,
      reviewable fix. This does not diagnose a failed pip or uv resolution.

      This is a local developer tool for a project the user chooses. It is not a
      repository-wide lint rule, a CI gate, or a proposal to enforce dependency
      policy across unrelated apps.

      ## When to use

      - The user asks to check, audit, diagnose, or autopsy a dependency manifest
      - The user wants to rule out direct-manifest issues before deeper install debugging
      - The user suspects stale pins, backports, duplicate entries, or dependency rot
      - The user asks whether anything looks wrong with their dependencies

      ## When not to use

      - Installing the current dependencies without diagnosing them
      - Upgrading every package or adding a new package
      - A full vulnerability audit. Use `pip-audit`, `npm audit`, or the project's
        approved security scanner for CVE coverage
      - Creating a repo-wide CI check. This skill is user-invoked and local

      ## Choose the manifest

      Use the path the user names. If no path is given and several manifests exist,
      ask which one to inspect. Do not sweep the repository or edit anything merely
      because the skill was triggered.

      Supported inputs:

      - `requirements.txt`
      - `pyproject.toml` using PEP 621 or common Poetry dependency tables
      - `package.json` dependency sections

      ## Run the offline diagnosis

      From this skill directory:

      ```bash
      python3 scripts/dep_doctor.py /path/to/requirements.txt --json
      ```

      The default path is fully offline. It reads only the selected manifest. The
      report shape is:

      ```json
      {
        "file": "/path/to/requirements.txt",
        "findings": [
          {
            "severity": "high",
            "kind": "stdlib-shadowing",
            "package": "pathlib",
            "line": 4,
            "why": "...",
            "fix": "..."
          }
        ],
        "summary": {
          "total": 1,
          "by_severity": {"high": 1},
          "by_kind": {"stdlib-shadowing": 1},
          "online": false
        }
      }
      ```

      The offline checks cover:

      - Python standard-library names published as packages
      - Known backports that should not be installed on supported Python versions
      - Dependencies without a usable version constraint
      - Repeated package entries
      - Conflicting exact pins for the same package

      For `package.json`, Python-specific standard-library and backport checks do not
      apply. The doctor still checks unpinned values and repeated dependency entries.

      ## Explain the diagnosis

      Read `references/dependency-pitfalls.md` before presenting findings. Lead with
      high severity items, then medium and low. For each finding, include:

      1. Package and source line
      2. What can break
      3. The suggested fix

      Do not call every range a conflict. The deterministic core reports conflicting
      constraints only when exact pins disagree. Compatible constraints split across
      multiple lines are duplicate entries that should be combined.

      If there are no findings, say what was checked and note the limits. A clean
      report is not a CVE audit or a full dependency resolver.

      ## Optional PyPI yank check

      The online check sends package names and exact pinned versions to `pypi.org`.
      Ask for permission before enabling it, even if the user previously requested an
      offline diagnosis.

      ```bash
      python3 scripts/dep_doctor.py /path/to/requirements.txt --json --online
      ```

      It reports an exact Python release only when every file for that release is
      marked yanked. Network failures become low-severity findings instead of hiding
      the offline diagnosis.

      ## Offer fixes, do not apply them silently

      After explaining the report, offer a focused edit. Wait for approval before
      changing the manifest.

      - Remove standard-library packages from supported Python projects
      - Remove obsolete backports, or add a Python-version marker when an old runtime
        genuinely needs one
      - For an unpinned dependency, inspect the working environment's installed
        version, confirm it is intended, and propose an exact reviewed pin
      - Keep one entry for duplicates and combine compatible constraints
      - For conflicting exact pins, inspect dependents before choosing a version
      - Replace a yanked pin with a tested, non-yanked release

      After any approved edit, rerun the offline diagnosis and the project's existing
      install or test command. Do not introduce a new CI gate.

      ## Files

      - `scripts/dep_doctor.py`: stdlib-only manifest parser and diagnosis engine
      - `references/dependency-pitfalls.md`: reasoning guide for the reported risks
