# Long polling only. Mandatory TELEGRAM_BOT_TOKEN and TELEGRAM_APPROVAL_PIN env.
# Exact private-chat numeric sender IDs, never usernames or groups.
schema: 1
enabled: false
user_ids: []
poll_seconds: 20
challenge_seconds: 60
quiet_utc_hours: []
# Explicit export opt-in; default reports contain status/IDs, not task/code text.
allow_report_text: false

# OFF: private action arguments may include code. Oversized/redacted reviews
# cannot be approved through the compact Telegram detail view.
approval_details: false
voice:
  enabled: false
  send_enabled: false
  max_seconds: 30
  max_bytes: 2000000
