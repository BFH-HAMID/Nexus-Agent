# Nexus tutor (Task 30) - OPERATOR-OWNED, default OFF.
#
# Flashcards with spaced repetition: a card you know well comes back after a
# longer and longer pause, a card you miss comes back today. You write the
# cards, import them from a file, or (opt-in) let a model propose them from
# your notes. Nothing here goes online by itself.
# This file is protected: the model cannot edit it.
schema: 1
enabled: false

# false: cards are kept as plain JSON in the Nexus state folder.
# true:  AES-256-GCM with a key in the OS keyring (pip install "nexus-agent[secure-state]").
encrypt_at_rest: false

schedule:                    # the SM-2 method, see docs/tutor.md
  new_per_day: 10            # new cards shown per day
  reviews_per_day: 100       # reviews of cards you have seen before, per day
  starting_ease: 2.5         # how fast the pauses grow for a new card (1.3 = slowest)
  first_interval_days: 1     # pause after the first right answer
  second_interval_days: 6    # pause after the second right answer in a row
  max_interval_days: 365

quiz:
  questions: 10              # length of a quiz when you do not say

limits:
  max_decks: 50
  max_cards: 5000            # a full collection refuses new cards; nothing is dropped silently
  max_card_chars: 600        # per side
  max_import_bytes: 500000

# Both off: no model is ever called.
model:
  grade: false               # true: a quiz answer that does not match the card word for word is judged by a model
  generate: false            # true: `nexus tutor generate FILE` asks a model to propose cards from that file
  agent: ""                  # agents.yaml name (empty = workspace default)
  allow_cloud: false         # false: cards, answers and notes never go to a cloud agent
  max_tokens_per_call: 900
  calls_per_hour: 120        # when it is used up, grading asks you instead and `generate` waits

voice:
  enabled: false             # true: "quiz me on spanish" starts a spoken quiz, for a verified speaker only
  idle_minutes: 3            # a spoken quiz ends by itself after this long without an answer

# true: the agent gets tutor_cards and tutor_stats (read) and tutor_add (asks you before it adds cards).
agent_tools: false
