# ─────────────────────────────────────────────────────────────────────────────
# Nexus Agent — roles.yaml
#
# 107 specialists. Each block is data only: adding a role NEVER needs a
# code change. The router (nexus/router.py) matches `keywords` first and falls back
# to an LLM classifier; the chosen role's `persona` becomes the system prompt and
# `agent` selects the model endpoint defined in agents.yaml.
#
# Role schema
#   title      : human readable name shown in the CLI
#   category   : grouping for `nexus roles`
#   agent      : key in agents.yaml (empty = default_agent)
#   model      : optional per-role model override
#   persona    : system prompt injected for this role
#   keywords   : routing signals; "kw:2" or [kw, 2] raises the weight
#   aliases    : alternative names accepted by /role and the router
#   focus      : short bullet list appended to the persona
#   tools      : optional whitelist of tool names for this role
#   instructions: extra rules appended after the persona
#
# Generated by scripts/build_roles.py - edit that file, then re-run it.
# ─────────────────────────────────────────────────────────────────────────────

roles:

